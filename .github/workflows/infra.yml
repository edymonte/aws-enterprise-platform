name: infra

# PR  -> terraform plan per layer with the READ-ONLY role (OIDC subject: pull_request)
# Run -> manual plan/apply/destroy of ONE layer with the DEPLOY role,
#        gated by the 'lab' environment (Settings > Environments > lab > reviewers)
on:
  pull_request:
    paths: ['infra/**']
  workflow_dispatch:
    inputs:
      layer:
        type: choice
        options: [10-network, 20-governance, 30-data, 40-eks, 50-edge, 60-observability]
      action:
        type: choice
        options: [plan, apply, destroy]
        default: plan

permissions:
  id-token: write   # OIDC token for AWS STS (no access keys)
  contents: read
  pull-requests: write

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  TF_IN_AUTOMATION: 'true'

jobs:
  plan:
    if: github.event_name == 'pull_request' && vars.AWS_DEPLOY_ROLE_ARN != ''
    name: plan ${{ matrix.layer }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        layer: [10-network, 20-governance, 30-data, 40-eks]
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_PLAN_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.12.2
      - name: Shared variables and backend (from repository variables)
        run: ./scripts/ci-write-runtime.sh
        env:
          TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
          ALERT_EMAIL: ${{ vars.ALERT_EMAIL }}
          OPERATOR_IP_RANGES: ${{ vars.OPERATOR_IP_RANGES }}
          NAME_SUFFIX: ${{ vars.NAME_SUFFIX }}
      - name: terraform plan
        working-directory: infra/terraform/${{ matrix.layer }}
        run: |
          terraform init -input=false -backend-config=../../../.runtime/backend.hcl -backend-config=key=${{ matrix.layer }}.tfstate
          terraform plan -input=false -lock=false -no-color -var-file=../../../.runtime/common.tfvars.json | tee plan.txt
      - name: Comment plan summary on the PR
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const out = fs.readFileSync('infra/terraform/${{ matrix.layer }}/plan.txt', 'utf8');
            const summary = (out.match(/Plan: .*|No changes\..*/) || ['(see job log)'])[0];
            await github.rest.issues.createComment({
              ...context.repo, issue_number: context.issue.number,
              body: `**${{ matrix.layer }}** — ${summary}`
            });

  run:
    if: github.event_name == 'workflow_dispatch'
    name: ${{ inputs.action }} ${{ inputs.layer }}
    runs-on: ubuntu-latest
    environment: lab        # approval gate + OIDC subject environment:lab
    concurrency: tfstate-${{ inputs.layer }}
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.12.2
      - run: ./scripts/ci-write-runtime.sh
        env:
          TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
          ALERT_EMAIL: ${{ vars.ALERT_EMAIL }}
          OPERATOR_IP_RANGES: ${{ vars.OPERATOR_IP_RANGES }}
          NAME_SUFFIX: ${{ vars.NAME_SUFFIX }}
      - name: terraform ${{ inputs.action }}
        working-directory: infra/terraform/${{ inputs.layer }}
        run: |
          terraform init -input=false -backend-config=../../../.runtime/backend.hcl -backend-config=key=${{ inputs.layer }}.tfstate
          DESTROY=""; [ "${{ inputs.action }}" = "destroy" ] && DESTROY="-destroy"
          terraform plan $DESTROY -input=false -out=tfplan -var-file=../../../.runtime/common.tfvars.json
          if [ "${{ inputs.action }}" != "plan" ]; then terraform apply -input=false tfplan; fi
