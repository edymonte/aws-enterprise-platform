apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: aws-load-balancer-controller
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-10"
spec:
  project: default
  source:
    repoURL: https://aws.github.io/eks-charts
    chart: aws-load-balancer-controller
    targetRevision: 3.6.0
    helm:
      valuesObject:
        clusterName: eks-mfs-portal-lab      # deterministic (40-eks); region/VPC are discovered via IMDS
        serviceAccount:
          create: true
          name: aws-load-balancer-controller # matches the Pod Identity association in 40-eks
        replicaCount: 1
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
