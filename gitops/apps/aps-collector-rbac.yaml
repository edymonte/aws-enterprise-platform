apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: aps-collector-rbac
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-10"
spec:
  project: default
  source:
    repoURL: https://github.com/edymonte/aws-enterprise-platform.git
    targetRevision: main
    path: gitops/platform/aps-collector
  destination:
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
