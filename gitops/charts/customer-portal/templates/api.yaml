# No annotation needed on the ServiceAccount: EKS Pod Identity maps
# (namespace, service account) -> IAM role on the AWS side (40-eks).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: customer-portal-api
  labels:
    {{- include "portal.labels" . | nindent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: customer-portal-api
  labels:
    {{- include "portal.labels" . | nindent 4 }}
    app.kubernetes.io/name: customer-portal-api
    {{- if .Values.datadog.enabled }}
    tags.datadoghq.com/env: {{ .Values.environment | quote }}
    tags.datadoghq.com/service: customer-portal-api
    tags.datadoghq.com/version: {{ .Values.image.api.tag | quote }}
    {{- end }}
spec:
  {{- if not .Values.hpa.enabled }}
  replicas: {{ .Values.api.replicas }}
  {{- end }}
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: customer-portal-api
  template:
    metadata:
      labels:
        {{- include "portal.labels" . | nindent 8 }}
        app.kubernetes.io/name: customer-portal-api
        {{- if .Values.datadog.enabled }}
        tags.datadoghq.com/env: {{ .Values.environment | quote }}
        tags.datadoghq.com/service: customer-portal-api
        tags.datadoghq.com/version: {{ .Values.image.api.tag | quote }}
        {{- end }}
      annotations:
        # Picked up by the Amazon Managed Prometheus collector (observability/amp-scraper-config.yaml)
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: /metrics
    spec:
      serviceAccountName: customer-portal-api
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: customer-portal-api
      containers:
        - name: api
          image: {{ include "portal.image" (list . .Values.image.api) | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: APP_VERSION
              value: {{ .Values.image.api.tag | quote }}
            - name: APP_ENV
              value: {{ .Values.environment | quote }}
            - name: AWS_REGION
              value: {{ .Values.region | quote }}
            {{- if .Values.database.host }}
            - name: PGHOST
              value: {{ .Values.database.host | quote }}
            - name: PGPORT
              value: {{ .Values.database.port | quote }}
            - name: PGDATABASE
              value: {{ .Values.database.name | quote }}
            - name: PGUSER
              value: {{ .Values.database.user | quote }}
            {{- end }}
            - name: CHAOS_ERROR_RATE
              value: {{ .Values.chaos.errorRate | quote }}
            - name: CHAOS_LATENCY_MS
              value: {{ .Values.chaos.latencyMs | quote }}
            {{- if .Values.datadog.enabled }}
            - name: DD_TRACE_ENABLED
              value: "true"
            - name: DD_AGENT_HOST
              value: {{ .Values.datadog.agentHost | quote }}
            - name: DD_ENV
              valueFrom:
                fieldRef:
                  fieldPath: metadata.labels['tags.datadoghq.com/env']
            - name: DD_SERVICE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.labels['tags.datadoghq.com/service']
            - name: DD_VERSION
              valueFrom:
                fieldRef:
                  fieldPath: metadata.labels['tags.datadoghq.com/version']
            - name: DD_LOGS_INJECTION
              value: "true"
            {{- end }}
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
          securityContext:
            {{- include "portal.securityContext" . | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            {{- if .Values.secrets.bannerSecretName }}
            - name: aws-secrets
              mountPath: /mnt/secrets
              readOnly: true
            {{- end }}
      volumes:
        - name: tmp
          emptyDir: {}
        {{- if .Values.secrets.bannerSecretName }}
        - name: aws-secrets
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: customer-portal-secrets
        {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: customer-portal-api
  labels:
    {{- include "portal.labels" . | nindent 4 }}
    app.kubernetes.io/name: customer-portal-api
  annotations:
    alb.ingress.kubernetes.io/healthcheck-path: /healthz
spec:
  selector:
    app.kubernetes.io/name: customer-portal-api
  ports:
    - name: http
      port: 80
      targetPort: http
{{- if .Values.secrets.bannerSecretName }}
---
# Secrets Manager -> file in the pod, authenticated with the pod's own
# EKS Pod Identity role (usePodIdentity).
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: customer-portal-secrets
  labels:
    {{- include "portal.labels" . | nindent 4 }}
spec:
  provider: aws
  parameters:
    usePodIdentity: "true"
    region: {{ .Values.region | quote }}
    objects: |
      - objectName: {{ .Values.secrets.bannerSecretName | quote }}
        objectType: "secretsmanager"
        objectAlias: "portal-banner"
{{- end }}
