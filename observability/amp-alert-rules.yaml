# SLO-oriented alerts for the customer portal (Prometheus rule file format).
groups:
  - name: customer-portal
    rules:
      - alert: PortalHighErrorRatio
        expr: |
          sum by (namespace) (rate(http_requests_total{namespace=~"portal-.*",status=~"5.."}[5m]))
          /
          sum by (namespace) (rate(http_requests_total{namespace=~"portal-.*"}[5m])) > 0.05
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "More than 5% of portal requests are failing in {{ $labels.namespace }} (availability SLO burn)."

      - alert: PortalHighLatencyP95
        expr: |
          histogram_quantile(0.95, sum by (le, namespace) (rate(http_request_duration_seconds_bucket{namespace=~"portal-.*"}[5m]))) > 0.5
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Portal p95 latency above 500 ms in {{ $labels.namespace }} (latency SLO)."

      - alert: PortalPodRestarting
        expr: increase(kube_pod_container_status_restarts_total{namespace=~"portal-.*"}[15m]) > 3
        labels:
          severity: warning
        annotations:
          summary: "Pod {{ $labels.pod }} restarted more than 3 times in 15 minutes."
